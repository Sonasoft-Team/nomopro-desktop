name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      FAMILY_REPO_TOKEN: ${{ secrets.FAMILY_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (skip native rebuild for CI)
        run: npm ci --ignore-scripts

      # `npm ci --ignore-scripts` skips package.json's postinstall (electron-rebuild of noble) and
      # electron-builder's npmRebuild is off, so noble's BLE binding was never compiled and Windows
      # 4.0.4 shipped without it (the link server failed to load -> blank window). Build it here.
      - name: Build native modules for Electron (noble)
        run: npx electron-rebuild -f -w @abandonware/noble

      - name: Check noble's native binding exists
        shell: bash
        run: ls -la node_modules/@abandonware/noble/build/Release/*.node

      # Needs the FAMILY_REPO_TOKEN secret, which GitHub never gives to pull requests from forks.
      # Without it the build still runs, just without a GUI inside.
      - name: Install the GUI from the pinned family release
        if: env.FAMILY_REPO_TOKEN != ''
        run: node scripts/fetch-gui.js

      - name: Install Python payload
        run: node scripts/install_python_payload.js --win

      - name: Install Arduino CLI
        run: choco install arduino-cli --no-progress

      - name: Create Arduino CLI config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/link/tools/Arduino/arduino-data/staging
          @"
          daemon:
            port: "50051"
          directories:
            data: .\arduino-data
            downloads: .\arduino-data\staging
            user: .\arduino-data
          library:
            enable_unsafe_install: false
          logging:
            file: ""
            format: text
            level: info
          board_manager:
            additional_urls:
              - https://dl.espressif.com/dl/package_esp32_index.json
          "@ | Set-Content -Path src/link/tools/Arduino/arduino-cli.yaml

      - name: Run tests
        run: npm run test:smoke

      - name: Build (unsigned)
        run: npm run build -- --publish=never

      - name: Check the packaged app carries noble's binding
        shell: bash
        run: ls -la dist/win-unpacked/resources/app/node_modules/@abandonware/noble/build/Release/*.node

      - uses: actions/upload-artifact@v4
        with:
          name: nomokit-desktop-windows
          path: dist/**

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      FAMILY_REPO_TOKEN: ${{ secrets.FAMILY_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Needs the FAMILY_REPO_TOKEN secret, which GitHub never gives to pull requests from forks.
      # Without it the build still runs, just without a GUI inside.
      - name: Install the GUI from the pinned family release
        if: env.FAMILY_REPO_TOKEN != ''
        run: node scripts/fetch-gui.js

      - name: Install Python payload
        run: |
          brew install zstd
          node scripts/install_python_payload.js --mac

      - name: Run tests
        run: npm run test:smoke

      - name: Build (unsigned, no publish)
        run: npm run build:mac -- --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: nomokit-desktop-macos
          path: dist/**
