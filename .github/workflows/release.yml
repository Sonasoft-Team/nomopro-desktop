name: Release

# Builds the installers for a vX.Y.Z tag into a DRAFT GitHub Release (publishing it is a manual
# click). Started either by pushing a tag, or by release-desktop.yml ("Release desktop" button),
# which bumps package.json, tags, and calls this workflow with the tag.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Tag to build, e.g. v4.0.5"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-macos:
    name: Release macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # electron-builder names and publishes the release after package.json "version", not the tag.
      # A tag that disagrees with it would build (and overwrite the draft of) a different version.
      - name: Tag must match package.json version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          V=$(node -p 'require("./package.json").version')
          [ "$TAG" = "v$V" ] || { echo "::error::tag $TAG does not match package.json version $V"; exit 1; }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # src/gui and nomokitjr/ are not committed; they come from the family release pinned in
      # gui.lock.json. --check refuses to build an installer whose GUI version nomo-kit.com does not
      # already announce (otherwise installed apps would be offered a "downgrade"). See the script.
      - name: Install the GUI from the pinned family release
        run: node scripts/fetch-gui.js --check
        env:
          FAMILY_REPO_TOKEN: ${{ secrets.FAMILY_REPO_TOKEN }}

      - name: Install Python payload
        run: |
          brew install zstd
          node scripts/install_python_payload.js --mac

      - name: Run tests
        run: npm run test:smoke

      - name: Build & publish
        run: npm run deploy:mac
        env:
          GH_TOKEN: ${{ github.token }}

  release-windows:
    name: Release Windows
    needs: release-macos
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `npm ci --ignore-scripts` skips package.json's postinstall (electron-rebuild of noble) and
      # electron-builder's npmRebuild is off, so noble's BLE binding is not compiled. Best effort
      # for now: Electron 42's headers no longer build with MSVC (needs clang-cl), so this fails and
      # BLE stays off on Windows; the link server then runs without the /openblock/ble route
      # (src/link/src/index.js) instead of blanking the app as 4.0.4 did. TODO: build with ClangCL.
      - name: Build noble's BLE binding for Electron (best effort)
        continue-on-error: true
        run: npx electron-rebuild -f --only @abandonware/noble

      - name: Report whether BLE is included
        shell: bash
        run: |
          if ls node_modules/@abandonware/noble/build/Release/*.node >/dev/null 2>&1; then
            echo "noble binding built: BLE included"
          else
            echo "::warning::noble's native binding is missing: BLE is disabled in this Windows build"
          fi

      # src/gui and nomokitjr/ are not committed; they come from the family release pinned in
      # gui.lock.json. --check refuses to build an installer whose GUI version nomo-kit.com does not
      # already announce (otherwise installed apps would be offered a "downgrade"). See the script.
      - name: Install the GUI from the pinned family release
        run: node scripts/fetch-gui.js --check
        env:
          FAMILY_REPO_TOKEN: ${{ secrets.FAMILY_REPO_TOKEN }}

      - name: Install Python payload
        run: node scripts/install_python_payload.js --win

      - name: Install Arduino CLI
        run: choco install arduino-cli --no-progress

      - name: Create Arduino CLI config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/link/tools/Arduino/arduino-data/staging
          @"
          daemon:
            port: "50051"
          directories:
            data: .\arduino-data
            downloads: .\arduino-data\staging
            user: .\arduino-data
          library:
            enable_unsafe_install: false
          logging:
            file: ""
            format: text
            level: info
          board_manager:
            additional_urls:
              - https://dl.espressif.com/dl/package_esp32_index.json
          "@ | Set-Content -Path src/link/tools/Arduino/arduino-cli.yaml

      - name: Run tests
        run: npm run test:smoke

      - name: Build & publish
        run: npm run deploy:win
        env:
          GH_TOKEN: ${{ github.token }}
